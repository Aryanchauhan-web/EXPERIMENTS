<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <fieldset>
        <legend>Biodata</legend>
        <form action="./response.html">
            <label for="name">Username:</label>
            <input type="text" name="name" placeholder="Enter your name">
            <br>
            <br>
            <label for="pass">Password:</label>
            <input type="password" name="pass" id="pass" placeholder="Enter your password">
            <br>
            <br>
            <label for="dob">DOB:</label>
            <input type="date" name="dob" placeholder="Enter your date of birth">
            <br>
            <br>
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="Male"> <label for="gender">Male</label>
            <input type="radio" name="gender" id="Female"> <label for="gender">Female</label><br><br>
          <label for="lang">Select Language</label> 
           <select name="lang" id="lang">
                <option value="secect"></option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>


            </select><br><br>
            <label for="hobb">Hobbies:</label>
            <input type="checkbox" name="hobb1" id="hobb"> <label for="hobb">Cricket</label>
            <input type="checkbox" name="hobb2" id="hobb"> <label for="hobb">Football</label><br><br>
            <label for="add">Address:</label>
            <textarea name="add" id="add" placeholder="Enter your Address"></textarea>
            <br><br>
            <label for="tel">Mobile Number:</label>
            <input type="tel" name="tel" id="tel" placeholder="Enter your Mobile Number">
            <br><br>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Enter your Email">
            <br><br>
            <label for="attmpt">Attempt:</label>
            <input type="number" name="" id="number" placeholder="No. of Attempts" > <br> <br>
            <label for="url">Homepage:</label>
            <input type="url" name="url" id="url" placeholder="Enter your profile url"> <br><br>
            <label for="file">Resume Upload:</label>
            <input type="file" name="file" id="file"> <br> <br>
            <input type="submit">
            <input type="reset">
        </form>
    </fieldset>
</body>
</html>
